<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32 Control</title>
  <style>
    :root {
      --bg:     #0d0d0d;
      --card:   #161616;
      --border: #2a2a2a;
      --accent: #e8c547;
      --text:   #f0ece0;
      --muted:  #888;
      --on:     #4caf50;
      --off:    #e05c5c;
      --font:   'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding: 24px 16px;
    }
    h1 { font-size: 1.2rem; letter-spacing: 4px; color: var(--accent); margin-bottom: 2px; }
    .sub { color: var(--muted); font-size: .72rem; letter-spacing: 2px; margin-bottom: 24px; }

    section { margin-bottom: 28px; }
    section h2 {
      font-size: .72rem;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    button {
      font-family: var(--font);
      font-size: .85rem;
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button.green { border-color: var(--on);  color: var(--on);  }
    button.red   { border-color: var(--off); color: var(--off); }

    input[type=number], input[type=time], select {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: .85rem;
    }

    .clock { font-size: 2rem; color: var(--accent); letter-spacing: 4px; margin-bottom: 2px; }
    .date  { font-size: .75rem; color: var(--muted); margin-bottom: 4px; }
    .sync  { font-size: .7rem; color: var(--muted); }
    .sync.ok { color: var(--on); }

    .sched-row {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: .82rem;
    }
    .sched-row span.on  { color: var(--on);  }
    .sched-row span.off { color: var(--off); }
    .sched-row button {
      padding: 2px 8px;
      font-size: .72rem;
    }
  </style>
</head>
<body>

  <h1>ESP32 Control</h1>
  <div class="sub">SHELLY CONTROLLER</div>

  <section>
    <h2>Tijd</h2>
    <div class="clock" id="clk">--:--:--</div>
    <div class="date"  id="dat">laden...</div>
    <div class="sync"  id="sync">sync: wachten...</div>
  </section>

  <section>
    <h2>Schakelaar</h2>
    <div class="row">
      <button class="green" onclick="fetch('/on')">AAN</button>
      <button class="red"   onclick="fetch('/off')">UIT</button>
    </div>
  </section>

  <section>
    <h2>Sequentie</h2>
    <div class="row">
      <input id="cnt" type="number" value="5" min="1" style="width:60px">
      <span style="color:var(--muted)">x</span>
      <input id="dly" type="number" value="2" min="1" style="width:60px">
      <span style="color:var(--muted);font-size:.8rem">sec</span>
      <button class="green" onclick="startSeq()">START</button>
      <button class="red"   onclick="fetch('/stop')">STOP</button>
    </div>
  </section>

  <section>
    <h2>Schema's</h2>
    <div class="row" style="margin-bottom:12px">
      <input type="time" id="stime" value="07:30">
      <select id="sact">
        <option value="1">Aanzetten</option>
        <option value="0">Uitzetten</option>
      </select>
      <button onclick="addSched()">Toevoegen</button>
    </div>
    <div id="stbl" style="color:var(--muted)">Laden...</div>
  </section>

  <script>
    function updateClock() {
      fetch('/status').then(r => r.json()).then(d => {
        document.getElementById('clk').textContent = d.time || '--:--:--';
        document.getElementById('dat').textContent = d.date || '';
        const s = document.getElementById('sync');
        s.textContent = d.synced ? 'sync: ok' : 'sync: wachten...';
        s.className = d.synced ? 'sync ok' : 'sync';
        renderTable(d.schedules || []);
      }).catch(() => {});
    }

    function renderTable(arr) {
      const el = document.getElementById('stbl');
      if (!arr.length) { el.textContent = "Geen schema's"; return; }
      el.innerHTML = arr.map(s =>
        `<div class="sched-row">
          <span>${s.time}</span>
          <span class="${s.on ? 'on' : 'off'}">${s.on ? 'AAN' : 'UIT'}</span>
          <button onclick="toggleSched(${s.idx})" style="${s.enabled ? 'color:var(--accent);border-color:var(--accent)' : ''}">${s.enabled ? 'actief' : 'uit'}</button>
          <button class="red" onclick="delSched(${s.idx})">x</button>
        </div>`
      ).join('');
    }

    function startSeq() {
      fetch('/start?count=' + document.getElementById('cnt').value + '&delay=' + document.getElementById('dly').value);
    }
    function addSched() {
      const t = document.getElementById('stime').value;
      const a = document.getElementById('sact').value;
      if (t) fetch('/sched/add?time=' + t + '&on=' + a);
    }
    function delSched(i)    { fetch('/sched/del?idx='    + i); }
    function toggleSched(i) { fetch('/sched/toggle?idx=' + i); }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
